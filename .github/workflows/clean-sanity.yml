name: Purge Sanity Posts

on:
  workflow_dispatch:
    inputs:
      delete_all:
        description: 'Delete all posts in Sanity (leave checked to delete all)'
        required: false
        default: true
        type: boolean

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || '7vlmtiag' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SANITY_API_VERSION: '2024-05-01'
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          NEXT_PUBLIC_SITE_URL: 'https://gainleadx.com'
        run: |
          node scripts/delete-dummy-sanity-posts.mjs --all
